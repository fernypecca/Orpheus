[project]
name = "growth-scraper"
version = "0.1.0"
description = "Generic, polite, LLM-ready web scraper for growth marketing research. Built on Crawl4AI."
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.9",
]

[project.scripts]
gscrape = "growth_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growth_scraper"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]